[package]
name = "clip-llm"
version = "0.22.1"
edition = "2024"
authors = ["Luke Lee <zekaizer@gmail.com>"]

[dependencies]
global-hotkey = "0.9"
arboard = "3"
reqwest = { version = "0.13", features = ["rustls", "json", "form", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.20"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
egui-wgpu = "0.37"
wgpu = "30"
wgpu-types = "30"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
zstd = "0.13"
png = "0.18"
base64 = "0.22"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }

[features]
diagnostics = ["chrono"]

[build-dependencies]
zstd = "0.13"
# Embeds the Windows app icon (build.rs); only runs for a Windows target.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Raw clipboard formats arboard does not expose; already linked through arboard.
clipboard-win = "5.4"
# COM (UI Automation) only; pinned to the version wgpu resolves (ADR-0003).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
