name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows-only code (platform/windows.rs, uia.rs, capture steps 2/4/5)
        # compiles only on the Windows runner.
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      # The `diagnostics` feature gates an entire scenario-runner module (and its
      # tests) plus cfg-branches in the UI/worker. Without these steps that code
      # is never compiled or run in CI and can rot undetected.
      - name: Clippy (diagnostics feature)
        run: cargo clippy --features diagnostics -- -D warnings

      - name: Test (diagnostics feature)
        run: cargo test --features diagnostics
