name: Release

on:
  release:
    types: [prereleased]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: clip-llm-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clip-llm-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package .app (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          bash scripts/package-macos-app.sh \
            "target/${{ matrix.target }}/release/clip-llm" \
            "$VERSION" \
            "${{ matrix.artifact }}.app.zip"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/clip-llm.exe ${{ matrix.artifact }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Version-stamp the asset filenames (strip the leading "v" from the tag),
          # e.g. clip-llm-0.14.3-windows-x64.exe. Build/artifact names stay fixed.
          VERSION="${TAG#v}"
          cp artifacts/clip-llm-macos-arm64/clip-llm-macos-arm64.app.zip \
            "clip-llm-${VERSION}-macos-arm64.app.zip"
          cp artifacts/clip-llm-windows-x64/clip-llm-windows-x64.exe \
            "clip-llm-${VERSION}-windows-x64.exe"
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "clip-llm-${VERSION}-macos-arm64.app.zip" \
            "clip-llm-${VERSION}-windows-x64.exe"

      - name: Promote to full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
